
name: Build Clock APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Extract Android project
        shell: bash
        run: |
          set -e
          rm -rf extracted
          mkdir -p extracted
          unzip -o ClockApp_Full_Project.zip -d extracted

          echo "Project contents:"
          find extracted/ClockApp_Full -maxdepth 3 -type f | sort

      - name: Build APK
        working-directory: extracted/ClockApp_Full
        run: gradle assembleDebug --stacktrace

      - name: Find APK
        shell: bash
        run: |
          set -e

          APK=$(find extracted/ClockApp_Full -type f \
            -path "*/build/outputs/apk/*.apk" | head -1)

          if [ -z "$APK" ]; then
            echo "ERROR: APK was not created."
            exit 1
          fi

          mkdir -p apk-output
          cp "$APK" apk-output/Clock.apk

          echo "APK created successfully:"
          ls -lh apk-output/Clock.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Clock-APK
          path: apk-output/Clock.apk
          if-no-files-found: error
