name: Build Premium Clock APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Extract project
        shell: bash
        run: |
          set -e
          rm -rf extracted
          mkdir -p extracted
          unzip -o ClockApp_Full_Project.zip -d extracted

      - name: Add JVM 17 compatibility
        working-directory: extracted/ClockApp_Full
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("app/build.gradle.kts")
          s = p.read_text()
          block = '''
          android {
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
          }

          tasks.withType<org.jetbrains.kotlin.gradle.tasks.KotlinCompile>().configureEach {
              compilerOptions {
                  jvmTarget.set(org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17)
              }
          }
          '''
          if "sourceCompatibility = JavaVersion.VERSION_17" not in s:
              p.write_text(s + "\n" + block)
          PY

      - name: Build APK
        working-directory: extracted/ClockApp_Full
        run: gradle assembleDebug --stacktrace

      - name: Collect APK
        shell: bash
        run: |
          set -e
          APK=$(find extracted/ClockApp_Full -type f -path "*/build/outputs/apk/*.apk" | head -1)
          test -n "$APK"
          mkdir -p apk-output
          cp "$APK" apk-output/Premium-Clock-5-Faces.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Premium-Clock-5-Faces-APK
          path: apk-output/Premium-Clock-5-Faces.apk
          if-no-files-found: error
