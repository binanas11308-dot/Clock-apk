name: Build Clock APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Extract Android project
        shell: bash
        run: |
          set -e
          rm -rf extracted
          mkdir -p extracted
          unzip -o ClockApp_Full_Project.zip -d extracted

      - name: Fix JVM targets
        working-directory: extracted/ClockApp_Full
        shell: bash
        run: |
          set -e

          python3 - <<'PY'
          from pathlib import Path

          p = Path("app/build.gradle.kts")
          s = p.read_text()

          block = r'''
          android {
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
          }

          tasks.withType<org.jetbrains.kotlin.gradle.tasks.KotlinCompile>().configureEach {
              compilerOptions {
                  jvmTarget.set(org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17)
              }
          }
          '''

          if "sourceCompatibility = JavaVersion.VERSION_17" not in s:
              s += "\n" + block

          p.write_text(s)
          print("JVM 17 configuration applied.")
          PY

          echo "Final app/build.gradle.kts:"
          cat app/build.gradle.kts

      - name: Build Debug APK
        working-directory: extracted/ClockApp_Full
        run: gradle assembleDebug --stacktrace

      - name: Find APK
        shell: bash
        run: |
          set -e

          APK=$(find extracted/ClockApp_Full \
            -type f \
            -path "*/build/outputs/apk/*.apk" | head -1)

          if [ -z "$APK" ]; then
            echo "ERROR: APK was not created."
            exit 1
          fi

          mkdir -p apk-output
          cp "$APK" apk-output/Clock.apk

          echo "APK successfully created:"
          ls -lh apk-output/Clock.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Clock-APK
          path: apk-output/Clock.apk
          if-no-files-found: error
