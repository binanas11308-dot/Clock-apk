YAML

name: Build Clock APK

'on':
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract Project
        run: |
          mkdir -p project
          unzip -o ClockApp_Full_Project.zip -d project

      - name: Find Project
        run: |
          find project -name settings.gradle.kts -print
          find project -name build.gradle.kts -print

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'

      - name: Install Gradle
        run: |
          curl -L https://services.gradle.org/distributions/gradle-4.4.1-bin.zip -o gradle.zip
          unzip -q gradle.zip
          echo "$PWD/gradle-4.4.1/bin" >> $GITHUB_PATH

      - name: Build APK
        run: |
          gradle -p project/ClockApp_Full assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Clock-APK
          path: project/ClockApp_Full/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
