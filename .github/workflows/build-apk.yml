      - name: Build APK
        working-directory: extracted/ClockApp_Full
        run: gradle assembleDebug --stacktrace

      - name: Collect APK
        run: |
          set -e
          APK=$(find extracted/ClockApp_Full -type f -path "*/build/outputs/apk/*.apk" | head -1)
          test -n "$APK"
          mkdir -p apk-output
          cp "$APK" apk-output/Clock-5-Faces.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Clock-5-Faces-APK
          path: apk-output/Clock-5-Faces.apk
          if-no-files-found: error
