name: Build Premium Clock - App + Widget
on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Extract project
        run: |
          set -e
          rm -rf extracted
          mkdir -p extracted
          unzip -o ClockApp_Full_Project.zip -d extracted
      - name: Install premium app and widget
        working-directory: extracted/ClockApp_Full
        run: |
          set -e
          python3 - <<'PY'
          from pathlib import Path
          import base64,re
          main=base64.b64decode("").decode()
          widget=base64.b64decode("").decode()
          layout=base64.b64decode("").decode()
          root=Path("app/src/main/java")
          mp=next(root.rglob("MainActivity.kt"))
          old=mp.read_text()
          pkg=re.search(r"^package\\s+([A-Za-z0-9_.]+)",old,re.M).group(1)
          wp=next(root.rglob("ClockWidgetProvider.kt"))
          wold=wp.read_text()
          wpkg=re.search(r"^package\\s+([A-Za-z0-9_.]+)",wold,re.M).group(1)
          basepkg=wpkg[:-7] if wpkg.endswith(".widget") else pkg
          mp.write_text(main.replace("__PACKAGE__",pkg))
          wp.write_text(widget.replace("__PACKAGE__",basepkg))
          Path("app/src/main/res/layout/widget_clock.xml").write_text(layout)
          Path("app/src/main/res/layout-v26/widget_clock.xml").write_text(layout)
          g=Path("app/build.gradle.kts"); s=g.read_text()
          if "sourceCompatibility = JavaVersion.VERSION_17" not in s:
              s += """
android {
    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }
}
tasks.withType<org.jetbrains.kotlin.gradle.tasks.KotlinCompile>().configureEach {
    compilerOptions {
        jvmTarget.set(org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17)
    }
}
"""
              g.write_text(s)
          print("Installed premium 5-face app + widget.")
          PY
      - name: Build APK
        working-directory: extracted/ClockApp_Full
        run: gradle assembleDebug --stacktrace
      - name: Collect APK
        run: |
          set -e
          APK=$(find extracted/ClockApp_Full -type f -path "*/build/outputs/apk/*.apk" | head -1)
          test -n "$APK"
          mkdir -p apk-output
          cp "$APK" apk-output/Premium-Clock-5-Faces.apk
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Premium-Clock-5-Faces-APK
          path: apk-output/Premium-Clock-5-Faces.apk
          if-no-files-found: error
