name: Build Clock APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract project ZIP
        run: |
          ZIP_FILE=$(find . -maxdepth 2 -name "*.zip" | head -n 1)
          echo "Found ZIP: $ZIP_FILE"
          unzip -o "$ZIP_FILE" -d .

      - name: Align Java and Kotlin JVM target to 17
        run: |
          python3 - <<'EOF'
          from pathlib import Path
          import re

          gradle_file = Path("ClockApp_Full/app/build.gradle.kts")
          text = gradle_file.read_text(encoding="utf-8")

          text = re.sub(r"JavaVersion\.VERSION_1_8", "JavaVersion.VERSION_17", text)
          text = re.sub(r'jvmTarget\s*=\s*"1\.8"', 'jvmTarget = "17"', text)
          text = re.sub(r"JvmTarget\.JVM_1_8", "JvmTarget.JVM_17", text)

          if "compileOptions" not in text:
              text += """

android {
    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }
}
"""

          if "kotlinOptions" not in text and "compilerOptions" not in text:
              text += """

kotlin {
    compilerOptions {
        jvmTarget.set(org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17)
    }
}
"""

          gradle_file.write_text(text, encoding="utf-8")
          print("Updated app/build.gradle.kts for JVM 17")
          EOF

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Debug APK
        working-directory: ClockApp_Full
        run: gradle assembleDebug --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ClockApp-Debug-APK
          path: ClockApp_Full/app/build/outputs/apk/debug/*.apk
