name: Check Clock Project

on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check repository
        run: |
          echo "Repository files:"
          ls -la
          echo "ZIP files:"
          find . -maxdepth 2 -type f -name "*.zip" -print

      - name: Extract project
        run: |
          rm -rf project
          mkdir project
          unzip -o ClockApp_Full_Project.zip -d project
          echo "Extracted files:"
          find project -maxdepth 4 -type f -print | sort

      - name: Find Gradle wrapper
        run: |
          echo "gradlew:"
          find project -type f -name "gradlew" -print

      - name: Find settings files
        run: |
          echo "settings.gradle:"
          find project -type f -name "settings.gradle" -print
          echo "settings.gradle.kts:"
          find project -type f -name "settings.gradle.kts" -print

      - name: Find build files
        run: |
          echo "build.gradle:"
          find project -type f -name "build.gradle" -print
          echo "build.gradle.kts:"
          find project -type f -name "build.gradle.kts" -print
