name: Build Clock APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract Android project
        run: |
          rm -rf project
          mkdir project
          unzip -o ClockApp_Full_Project.zip -d project

      - name: Setup Java 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "8"

      - name: Check Java
        run: |
          java -version

      - name: Build APK
        working-directory: project/ClockApp_Full
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Find APK
        run: |
          find project/ClockApp_Full -type f -name "*.apk" -print

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Clock-APK
          path: project/ClockApp_Full/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
