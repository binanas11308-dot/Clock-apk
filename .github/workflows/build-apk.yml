name: Build Clock APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Find Android project
        shell: bash
        run: |
          set -e
          echo "Repository files:"
          find . -maxdepth 3 -type f | sort | head -200

          if [ -f "./gradlew" ]; then
            echo "PROJECT_DIR=." >> "$GITHUB_ENV"
            exit 0
          fi

          ZIP=$(find . -maxdepth 2 -type f -name "*.zip" | head -1 || true)
          if [ -n "$ZIP" ]; then
            mkdir -p extracted
            unzip -o "$ZIP" -d extracted
          fi

          GRADLEW=$(find . -type f -name "gradlew" -not -path "./.git/*" | head -1 || true)

          if [ -z "$GRADLEW" ]; then
            echo "ERROR: gradlew was not found."
            echo "The repository must contain a complete Android/Gradle project."
            exit 1
          fi

          PROJECT_DIR=$(dirname "$GRADLEW")
          PROJECT_DIR="${PROJECT_DIR#./}"
          if [ -z "$PROJECT_DIR" ]; then PROJECT_DIR="."; fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Using Android project: $PROJECT_DIR"

      - name: Make Gradle executable
        working-directory: ${{ env.PROJECT_DIR }}
        run: chmod +x gradlew

      - name: Build debug APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: ./gradlew assembleDebug --stacktrace

      - name: Find APK
        shell: bash
        run: |
          set -e
          APK=$(find "${PROJECT_DIR}" -type f -path "*/build/outputs/apk/*.apk" | head -1 || true)
          if [ -z "$APK" ]; then
            echo "ERROR: APK was not created."
            exit 1
          fi
          mkdir -p apk-output
          cp "$APK" apk-output/Clock.apk
          echo "APK created: apk-output/Clock.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Clock-APK
          path: apk-output/Clock.apk
          if-no-files-found: error
