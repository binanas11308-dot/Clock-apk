name: Check Clock Project

on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check repository
        run: |
          echo "=== Repository ==="
          ls -la
          echo "=== ZIP files ==="
          find . -maxdepth 2 -type f -name "*.zip" -print

      - name: Extract project
        run: |
          rm -rf project
          mkdir project
          unzip -o ClockApp_Full_Project.zip -d project
          echo "=== Extracted files ==="
          find project -maxdepth 4 -type f -print | sort

      - name: Find Gradle files
        run: |
          echo "=== gradlew ==="
          find project -type f -name "gradlew" -print

          echo "=== settings.gradle ==="
          find project -type f -name "settings.gradle" -o -name "settings.gradle.kts" -print

          echo "=== build.gradle ==="
          find project -type f -name "build.gradle" -o -name "build.gradle.kts" -print
