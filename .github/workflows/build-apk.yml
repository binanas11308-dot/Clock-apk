YAML

name: Build Clock APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract Project
        run: |
          mkdir -p project
          unzip -o ClockApp_Full_Project.zip -d project

      - name: Find Project Folder
        run: |
          SETTINGS=$(find project -type f -name "settings.gradle.kts" -print -quit)
          if [ -z "$SETTINGS" ]; then
            echo "ERROR: settings.gradle.kts not found"
            exit 1
          fi
          PROJECT_DIR=$(dirname "$SETTINGS")
          echo "PROJECT_DIR=$PROJECT_DIR" >> $GITHUB_ENV
          echo "Project folder: $PROJECT_DIR"
          ls -la "$PROJECT_DIR"

      - name: Setup Java 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "8"

      - name: Install Gradle 4.4.1
        run: |
          curl -L https://services.gradle.org/distributions/gradle-4.4.1-bin.zip -o gradle.zip
          unzip -q gradle.zip
          echo "$PWD/gradle-4.4.1/bin" >> $GITHUB_PATH

      - name: Build APK
        run: |
          gradle --version
          gradle -p "$PROJECT_DIR" assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Clock-APK
          path: project/**/build/outputs/apk/**/*.apk
          if-no-files-found: error
