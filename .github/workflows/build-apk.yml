name: Build Clock APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract Android project
        run: |
          rm -rf project
          mkdir project
          unzip -o ClockApp_Full_Project.zip -d project

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install Gradle
        run: |
          sudo apt-get update
          sudo apt-get install -y gradle
          gradle --version

      - name: Create Gradle wrapper
        working-directory: project/ClockApp_Full
        run: |
          gradle wrapper
          chmod +x gradlew

      - name: Build Debug APK
        working-directory: project/ClockApp_Full
        run: |
          ./gradlew assembleDebug --stacktrace

      - name: Find APK
        run: |
          find project/ClockApp_Full -type f -name "*.apk" -print

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Clock-APK
          path: project/ClockApp_Full/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
