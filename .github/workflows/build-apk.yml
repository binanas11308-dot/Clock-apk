      - name: Add widget receiver to AndroidManifest
        shell: bash
        run: |
          set -e

          MANIFEST="ClockApp_Full/app/src/main/AndroidManifest.xml"

          if [ ! -f "$MANIFEST" ]; then
            echo "ERROR: AndroidManifest.xml not found."
            exit 1
          fi

          if ! grep -q "ClockWidgetProvider" "$MANIFEST"; then

            python3 - <<'PY'
          from pathlib import Path

          p = Path("ClockApp_Full/app/src/main/AndroidManifest.xml")
          s = p.read_text()

          receiver = '''
                  <receiver
                      android:name=".widget.ClockWidgetProvider"
                      android:exported="false">
                      <intent-filter>
                          <action android:name="android.appwidget.action.APPWIDGET_UPDATE" />
                          <action android:name="CLOCK_NEXT_FACE" />
                          <action android:name="CLOCK_PREVIOUS_FACE" />
                      </intent-filter>

                      <meta-data
                          android:name="android.appwidget.provider"
                          android:resource="@xml/clock_widget_info" />
                  </receiver>
          '''

          if "</application>" in s:
              s = s.replace("</application>", receiver + "\n    </application>")
              p.write_text(s)
          else:
              raise SystemExit("No application tag found")
          PY

          fi

      - name: Create widget provider info
        shell: bash
        run: |
          set -e

          mkdir -p ClockApp_Full/app/src/main/res/xml

          cat > ClockApp_Full/app/src/main/res/xml/clock_widget_info.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <appwidget-provider
              xmlns:android="http://schemas.android.com/apk/res/android"
              android:minWidth="180dp"
              android:minHeight="110dp"
              android:updatePeriodMillis="60000"
              android:initialLayout="@layout/widget_clock"
              android:resizeMode="horizontal|vertical"
              android:widgetCategory="home_screen"
              android:previewImage="@drawable/widget_bg_obsidian" />
          EOF

      - name: Build Debug APK
        working-directory: ClockApp_Full
        shell: bash
        run: |
          set -e
          gradle assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ClockApp-Debug-APK
          path: ClockApp_Full/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
